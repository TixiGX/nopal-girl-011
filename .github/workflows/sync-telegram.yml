name: Sync galleria da Telegram

on:
  schedule:
    - cron: "*/20 * * * *"     # ogni 20 minuti
  workflow_dispatch:           # avvio manuale dalla tab Actions
  push:                        # sync subito dopo ogni aggiornamento su main
    branches: [main]           # (i commit del bot non ri-attivano i workflow)

permissions:
  contents: write

concurrency:
  group: sync-telegram
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnostica configurazione
        env:
          S1: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S2: ${{ secrets.TELEGRAM_TOKEN }}
          S3: ${{ secrets.BOT_TOKEN }}
          S4: ${{ secrets.TELEGRAM_BOT_KEY }}
          CH: ${{ vars.TELEGRAM_CHANNEL }}
        run: |
          for entry in "TELEGRAM_BOT_TOKEN:$S1" "TELEGRAM_TOKEN:$S2" "BOT_TOKEN:$S3" "TELEGRAM_BOT_KEY:$S4"; do
            name="${entry%%:*}"; val="${entry#*:}"
            if [ -n "$val" ]; then echo "::notice::Secret $name PRESENTE"; else echo "::notice::Secret $name assente"; fi
          done
          if [ -n "$CH" ]; then echo "::notice::Variabile TELEGRAM_CHANNEL=$CH"; else echo "::notice::Variabile TELEGRAM_CHANNEL assente (rilevamento automatico)"; fi

      - name: Verifica token e canale visti dal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_KEY }}
        run: |
          set +e
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Nessun token trovato tra i secrets (nomi accettati: TELEGRAM_BOT_TOKEN, TELEGRAM_TOKEN, BOT_TOKEN, TELEGRAM_BOT_KEY)"
            exit 1
          fi
          ME=$(curl -s --max-time 30 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
          echo "$ME" | head -c 500; echo
          echo "$ME" | grep -q '"ok":true' && echo "::notice::getMe OK: token valido" || { echo "::error::getMe fallito: token non valido o bloccato"; exit 1; }
          curl -s --max-time 35 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?timeout=0&allowed_updates=%5B%22channel_post%22,%22edited_channel_post%22%5D" -o /tmp/upd.json
          jq -e '.ok == true' /tmp/upd.json > /dev/null || { echo "::error::getUpdates: $(jq -r '.description // "risposta non valida"' /tmp/upd.json)"; exit 1; }
          jq -r '[.result[] | select(.channel_post or .edited_channel_post) | (.channel_post // .edited_channel_post).chat] | unique | .[] | "::notice::Il bot vede il canale \"" + .title + "\" (id=" + (.id|tostring) + ", username=@" + (.username // "") + ")"' /tmp/upd.json
          if [ "$(jq '[.result[] | select(.channel_post or .edited_channel_post)] | length' /tmp/upd.json)" = "0" ]; then
            echo "::notice::Nessun post di canale in coda: il bot deve essere amministratore del canale, che deve avere almeno una foto pubblicata dopo l'aggiunta del bot"
          fi

      - name: Sincronizza le foto dal canale Telegram
        env:
          # Accetta i nomi di secret più comuni: va bene qualunque dei quattro.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_KEY }}
          # Opzionale: variabile di repository (Settings -> Variables) con
          # @username del canale o il suo id -100... Se manca viene rilevato
          # automaticamente dal primo post che il bot vede.
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
        run: |
          set +e
          python3 scripts/sync_telegram.py 2> sync_error.log
          rc=$?
          # Espone l'esito come annotazione: AVVISO -> notice, ERRORE -> error.
          while IFS= read -r line; do
            case "$line" in
              AVVISO:*) echo "::notice::$line" ;;
              *) [ -n "$line" ] && echo "::error::$line" ;;
            esac
          done < sync_error.log
          [ $rc -ne 0 ] && exit $rc

      - name: Commit delle novità
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/photos.json assets/images/telegram
          if git diff --cached --quiet; then
            echo "Nessuna novità."
          else
            git commit -m "chore: aggiorna galleria da Telegram ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
