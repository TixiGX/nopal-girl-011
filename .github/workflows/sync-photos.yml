name: Sync foto da Google Foto

on:
  schedule:
    - cron: "0 */6 * * *"      # ogni 6 ore
  workflow_dispatch:           # avvio manuale dalla tab Actions

permissions:
  contents: write

concurrency:
  group: sync-photos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leggi l'album Google Foto
        env:
          PHOTOS_ALBUM_URL: ${{ secrets.PHOTOS_ALBUM_URL }}
        run: python3 scripts/sync_photos.py

      - name: Commit delle novità
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/photos.json
          if git diff --cached --quiet; then
            echo "Nessuna novità."
          else
            git commit -m "chore: aggiorna foto da Google Foto ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
